name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: pip install tiktoken
      # offline replay of the committed fixtures; verify.py exits 1 (and run.sh with it) when anything is missing
      - name: Benchmark replay
        run: |
          PY=python3 bench/run.sh "$RUNNER_TEMP/bench" | tee "$RUNNER_TEMP/bench.log"
          if grep -E '[1-9][0-9]* missing' "$RUNNER_TEMP/bench.log"; then exit 1; fi
